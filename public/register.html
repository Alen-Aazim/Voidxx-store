<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — Voidxx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="header-slot"></div>

<div class="container">
  <div class="card form-card">
    <span class="serif" style="font-style:italic;color:var(--accent-deep);">— Create your account</span>
    <h2>Join Voidxx</h2>
    <p class="muted small">It takes about 30 seconds.</p>
    <div id="err" class="error-text" style="display:none;"></div>
    <form id="regForm">
      <div class="field">
        <label class="label">Full name</label>
        <input class="input" name="full_name" placeholder="Jane Doe">
      </div>
      <div class="field">
        <label class="label">Username</label>
        <input class="input" name="username" required>
      </div>
      <div class="field">
        <label class="label">Email</label>
        <input class="input" type="email" name="email" required>
      </div>
      <div class="field">
        <label class="label">Password</label>
        <input class="input" type="password" name="password" required minlength="6">
      </div>
      <button class="btn btn-accent btn-block" type="submit">Create account</button>
    </form>
    <p class="muted-note">Already have one? <a href="/login"><strong>Sign in →</strong></a></p>
  </div>
</div>

<div id="footer-slot"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/api/auth/register', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    location.href = '/account';
  } catch (err) {
    const el = document.getElementById('err'); el.textContent = err.message; el.style.display = 'block';
  }
});
</script>
</body>
</html>
