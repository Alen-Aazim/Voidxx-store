<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Bag — Voidxx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" href="/images/voidxx-mark.png">
</head>
<body>
<div id="header-slot"></div>

<div class="container">
  <div class="page-intro">
    <span class="crumb">— Your Bag</span>
    <h1>Cart.</h1>
    <p id="cartSummary" class="muted">Loading your bag…</p>
  </div>
  <div id="cartArea"></div>
</div>

<div id="footer-slot"></div>
<script src="/js/app.js"></script>
<script>
let CART_DATA = null;

async function refresh() {
  const data = await api('/api/cart');
  CART_DATA = data;
  document.getElementById('cartCount').textContent = data.count;
  document.getElementById('cartSummary').textContent = data.count
    ? `${data.count} item${data.count === 1 ? '' : 's'} in your bag.`
    : 'Your bag is empty.';

  if (!data.items.length) {
    document.getElementById('cartArea').innerHTML = `
      <div class="card cart-empty">
        <h2>Nothing here yet</h2>
        <p>Browse the shop and add a few favourites.</p>
        <a class="btn btn-accent" href="/products">Start shopping</a>
      </div>`;
    return;
  }

  const list = data.items.map(({ product: p, qty, line }) => `
    <div class="cart-item" data-id="${p.id}">
      <a class="ci-img" href="/product?id=${p.id}">${img(p.image, p.name)}</a>
      <div>
        <div class="ci-meta">${escapeHtml(p.category)}</div>
        <h4><a href="/product?id=${p.id}">${escapeHtml(p.name)}</a></h4>
        <div class="ci-price">${fmt(p.price)}</div>
        <div class="qty-row">
          <div class="qty-pick">
            <button data-act="dec" data-id="${p.id}">−</button>
            <span>${qty}</span>
            <button data-act="inc" data-id="${p.id}">+</button>
          </div>
          <button class="btn btn-ghost btn-sm" data-act="rm" data-id="${p.id}">Remove</button>
        </div>
      </div>
      <div style="text-align:right;font-family:var(--display);font-size:1.1rem;">${fmt(line)}</div>
    </div>`).join('');

  const signedIn = !!window.__me?.user;
  const shippingForm = signedIn ? `
    <div class="card" style="margin-top:18px;">
      <h3 style="margin:0 0 6px;">Shipping details</h3>
      <p class="muted small" style="margin-bottom:18px;">Where should we send your order?</p>
      <form class="checkout-form" id="shippingForm">
        <div class="field">
          <label class="label">Full name</label>
          <input class="input" name="name" required placeholder="As on your ID">
        </div>
        <div class="row-2">
          <div class="field">
            <label class="label">Phone number</label>
            <input class="input" name="phone" required inputmode="tel" placeholder="+91 9XXXX XXXXX">
          </div>
          <div class="field">
            <label class="label">Pincode</label>
            <input class="input" name="pincode" required inputmode="numeric" maxlength="6" placeholder="6 digits">
          </div>
        </div>
        <div class="field">
          <label class="label">Address</label>
          <textarea class="textarea" name="address" required placeholder="House / flat number, street, area" style="min-height:80px;"></textarea>
        </div>
        <div class="row-2">
          <div class="field">
            <label class="label">City</label>
            <input class="input" name="city" required placeholder="e.g. Mumbai">
          </div>
          <div class="field">
            <label class="label">District</label>
            <input class="input" name="district" required placeholder="e.g. Mumbai Suburban">
          </div>
        </div>
      </form>
    </div>` : '';

  document.getElementById('cartArea').innerHTML = `
    <div class="cart-grid">
      <div>
        <div class="cart-list">${list}</div>
        ${shippingForm}
      </div>
      <aside class="cart-side">
        <h3>Order summary</h3>
        <div class="row"><span>Subtotal</span><span>${fmt(data.total)}</span></div>
        <div class="row"><span>Shipping</span><span class="muted">${data.total >= 2000 ? 'Free' : 'Calculated next'}</span></div>
        <div class="row total"><span>Total</span><span>${fmt(data.total)}</span></div>
        <button class="btn btn-accent" id="checkoutBtn">${signedIn ? 'Place order' : 'Sign in to checkout'} <span class="arrow">→</span></button>
        <button class="btn btn-ghost" id="clearBtn">Clear bag</button>
        ${signedIn ? '<p class="small muted" style="margin:14px 0 0;color:rgba(255,255,255,.55);">Cash on delivery available across India.</p>' : ''}
      </aside>
    </div>`;
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.matches('[data-act="inc"]')) {
    const id = t.dataset.id;
    const cur = Number(t.parentElement.querySelector('span').textContent);
    await api('/api/cart/update', { method: 'POST', body: JSON.stringify({ productId: Number(id), qty: cur + 1 }) });
    refresh();
  }
  if (t.matches('[data-act="dec"]')) {
    const id = t.dataset.id;
    const cur = Number(t.parentElement.querySelector('span').textContent);
    await api('/api/cart/update', { method: 'POST', body: JSON.stringify({ productId: Number(id), qty: Math.max(0, cur - 1) }) });
    refresh();
  }
  if (t.matches('[data-act="rm"]')) {
    await api('/api/cart/remove', { method: 'POST', body: JSON.stringify({ productId: Number(t.dataset.id) }) });
    refresh();
  }
  if (t.id === 'clearBtn') {
    await api('/api/cart/clear', { method: 'POST' });
    refresh();
  }
  if (t.id === 'checkoutBtn' || t.parentElement?.id === 'checkoutBtn') {
    if (!window.__me?.user) { location.href = '/login?next=/cart'; return; }
    const form = document.getElementById('shippingForm');
    if (!form) return;
    if (!form.reportValidity()) { form.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());
    try {
      const r = await api('/api/orders/checkout', { method: 'POST', body: JSON.stringify(payload) });
      toast('Order #' + r.orderId + ' placed!', 'success');
      setTimeout(() => location.href = '/orders', 700);
    } catch (e) { toast(e.message, 'error'); }
  }
});

document.addEventListener('app-ready', refresh);
</script>
</body>
</html>
