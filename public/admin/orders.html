<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Orders — Voidxx Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" href="/images/voidxx-mark.png">
</head>
<body>
<div id="header-slot"></div>

<div class="container">
  <div class="admin-shell">
    <div id="admin-side-slot"></div>
    <section>
      <div class="page-intro" style="text-align:left;padding-top:0;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:14px;">
        <div>
          <span class="crumb">— Orders</span>
          <h1>All orders.</h1>
          <p class="muted">Every order placed through the store, with shipping details.</p>
        </div>
        <a class="btn btn-accent" href="/admin/add-order">+ Add order to user</a>
      </div>
      <div id="ordersArea"></div>
    </section>
  </div>
</div>

<div id="footer-slot"></div>
<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
<script>
const STATUSES = ['Processing', 'Shipped', 'Delivered', 'Cancelled'];

function shippingHtml(o) {
  if (!o.shipping_name) return '<p class="muted small" style="margin-top:10px;">No shipping address (admin-placed order).</p>';
  return `
    <div class="shipping-block">
      <strong>Ship to</strong>
      <div class="ship-line">${escapeHtml(o.shipping_name)} · <span style="font-family:var(--mono);font-weight:700;">${escapeHtml(o.shipping_phone)}</span></div>
      <div class="ship-line" style="margin-top:4px;">${escapeHtml(o.shipping_address)}</div>
      <div class="ship-line" style="margin-top:2px;">${escapeHtml(o.shipping_city)}, ${escapeHtml(o.shipping_district)} — <strong style="font-family:var(--mono);">${escapeHtml(o.shipping_pincode)}</strong></div>
    </div>`;
}

async function refresh() {
  const orders = await api('/api/admin/orders');
  if (!orders.length) {
    document.getElementById('ordersArea').innerHTML = '<div class="card"><p class="muted">No orders yet.</p></div>';
    return;
  }
  document.getElementById('ordersArea').innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-head">
        <div>
          <h3>Order #${o.id} · ${escapeHtml(o.username)}</h3>
          <div class="order-meta">
            <span>${new Date(o.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}</span>
            <span>${o.items.length} item${o.items.length===1?'':'s'}</span>
            <span class="badge info">via ${o.placed_by}</span>
          </div>
        </div>
        <div style="text-align:right;">
          <select class="select" data-status="${o.id}" style="width:auto;display:inline-block;">
            ${STATUSES.map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <div style="margin-top:8px;font-family:var(--display);font-size:1.3rem;">${fmt(o.total)}</div>
        </div>
      </div>
      <div class="order-items">
        ${o.items.map(it => `
          <div class="order-line">
            <span class="name">${escapeHtml(it.product_name)}</span>
            <span class="qty">×${it.quantity}</span>
            <span class="each">${fmt(it.unit_price)} ea.</span>
            <span style="font-family:var(--display);">${fmt(it.unit_price * it.quantity)}</span>
          </div>`).join('')}
      </div>
      ${shippingHtml(o)}
      ${o.note ? `<p class="muted small" style="margin-top:12px;border-top:2px dashed var(--ink);padding-top:10px;"><strong>Note:</strong> ${escapeHtml(o.note)}</p>` : ''}
    </div>`).join('');
}

document.addEventListener('change', async (e) => {
  const id = e.target.dataset?.status;
  if (!id) return;
  await api('/api/admin/orders/' + id, { method: 'PATCH', body: JSON.stringify({ status: e.target.value }) });
  toast('Status updated', 'success');
});

document.addEventListener('app-ready', (e) => { if (e.detail?.admin) refresh(); });
</script>
</body>
</html>
