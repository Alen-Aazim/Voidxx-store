<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders — Voidxx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="header-slot"></div>

<div class="container">
  <div class="page-intro" style="text-align:left;">
    <span class="crumb">— Order history</span>
    <h1>Your orders</h1>
    <p class="muted">A complete record of everything you've ordered with Voidxx.</p>
  </div>
  <div id="ordersArea"></div>
</div>

<div id="footer-slot" style="margin-top:80px;"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('app-ready', async (e) => {
  if (!e.detail?.user) return location.href = '/login?next=/orders';
  const orders = await api('/api/orders');
  if (!orders.length) {
    document.getElementById('ordersArea').innerHTML = `
      <div class="card cart-empty">
        <h2>No orders yet</h2>
        <p>Once you place your first order, it'll show up here.</p>
        <a class="btn btn-accent" href="/products">Start shopping</a>
      </div>`;
    return;
  }
  document.getElementById('ordersArea').innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-head">
        <div>
          <h3>Order #${o.id}</h3>
          <div class="order-meta">
            <span>${new Date(o.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}</span>
            <span>${o.items.length} item${o.items.length === 1 ? '' : 's'}</span>
            ${o.placed_by === 'admin' ? '<span class="badge info">Placed by admin</span>' : ''}
          </div>
        </div>
        <div style="text-align:right;">
          <span class="badge ${o.status.toLowerCase()}">${o.status}</span>
          <div style="margin-top:6px;font-weight:600;font-size:1.15rem;">${fmt(o.total)}</div>
        </div>
      </div>
      <div class="order-items">
        ${o.items.map(it => `
          <div class="order-line">
            <span class="name">${escapeHtml(it.product_name)}</span>
            <span class="qty">×${it.quantity}</span>
            <span class="each">${fmt(it.unit_price)} ea.</span>
            <span>${fmt(it.unit_price * it.quantity)}</span>
          </div>`).join('')}
      </div>
      ${o.note ? `<p class="muted small" style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;"><strong>Note:</strong> ${escapeHtml(o.note)}</p>` : ''}
    </div>`).join('');
});
</script>
</body>
</html>
